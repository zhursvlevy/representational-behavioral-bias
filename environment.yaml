# Versions used to produce the paper's results (CUDA 12.8, single 16 GB GPU).
name: rbb
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.9.1
      - torchvision==0.24.1
      - transformers==5.2.0
      - accelerate==1.12.0
      - huggingface-hub==1.5.0
      - safetensors==0.6.2
      - tokenizers==0.22.1
      - numpy==2.2.6
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - matplotlib==3.10.7
      - pillow==12.0.0
      - tqdm==4.67.1
      - -e .
