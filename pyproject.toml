[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rbb"
version = "1.0.0"
description = "Representational vs. behavioral shape/texture bias in vision-language models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=5.2",
    "accelerate>=1.12",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rbb = ["resources/*"]
